# Render Blueprint — free setup, one service like Dayflow HRMS: the website and the API run
# in one Docker container (see Dockerfile), Postgres is on Neon, files are in Cloudflare R2.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the dashboard (see README "Deploy").

services:
  - type: web
    name: taggify-monetization
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations run on every start (deploy/start.sh), then the API, then the website.
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Neon → project → Connection string (postgresql://…?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 → bucket + an API token with Object Read & Write on that bucket
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
