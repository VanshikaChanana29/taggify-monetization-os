# Render Blueprint — staging environment.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the dashboard (see README "Deploy on Render").

databases:
  - name: taggify-db
    databaseName: taggify
    user: taggify
    region: singapore
    plan: free # free DB expires after 30 days — switch to basic-256mb before real data

services:
  - type: web
    name: taggify-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (preDeployCommand needs a paid plan).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: taggify-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # e.g. https://taggify-web.onrender.com

  - type: web
    name: taggify-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false # e.g. https://taggify-api.onrender.com
